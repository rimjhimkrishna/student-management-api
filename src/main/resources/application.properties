spring.application.name=student-management-api

# PostgreSQL Database Configuration (Active)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/student_db}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:845438}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.defer-datasource-initialization=false
spring.sql.init.mode=never

# Logging Configuration
logging.level.root=INFO
logging.level.com.example.student=DEBUG

# H2 Console (Disabled for PostgreSQL)
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

# Server Configuration
server.port=8080

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics,env
management.endpoint.health.show-details=always

# JWT Configuration
# Secret key must be a base64 encoded string of at least 256 bits (32 bytes)
application.security.jwt.secret-key=dGhpcy1pcy1hLXZlcnktc2VjdXJlLWFuZC1sb25nLXNlY3JldC1rZXktZm9yLWp3dC1hdXRoZW50aWNhdGlvbi1zcHJpbmctYm9vdA==
# Expiration: 1 day (86400000 milliseconds)
application.security.jwt.expiration=86400000
# Refresh token expiration: 7 days (604800000 milliseconds)
application.security.jwt.refresh-token.expiration=604800000

# Claude AI / OpenRouter Config
claude.api.key=${OPENROUTER_API_KEY:${CLAUDE_API_KEY}}
claude.api.url=${OPENROUTER_API_URL:https://openrouter.ai/api/v1/chat/completions}
claude.api.model=${OPENROUTER_API_MODEL:google/gemma-3-27b-it:free}
claude.api.max-tokens=1500
claude.api.timeout-seconds=30

# Cache
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=10m

# Rate limiting — 60 AI requests per user per minute
ai.rate-limit.requests-per-minute=60

# Actuator
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always

# Resilience4j
resilience4j.circuitbreaker.instances.claudeApi.slidingWindowSize=10
resilience4j.circuitbreaker.instances.claudeApi.failureRateThreshold=50
resilience4j.circuitbreaker.instances.claudeApi.waitDurationInOpenState=30s
resilience4j.retry.instances.claudeApi.maxAttempts=3
resilience4j.retry.instances.claudeApi.waitDuration=2s


