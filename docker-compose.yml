version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: student_db_container
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: student_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: yourpassword
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - student_network

  app:
    build: .
    container_name: student_app_container
    ports:
      - "8080:8080"
    environment:
      - DB_URL=jdbc:postgresql://db:5432/student_db
      - DB_USERNAME=postgres
      - DB_PASSWORD=yourpassword
      - CLAUDE_API_KEY=${CLAUDE_API_KEY}
    depends_on:
      - db
    networks:
      - student_network

volumes:
  postgres_data:

networks:
  student_network:
